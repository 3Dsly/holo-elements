<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HOLO·ELEMENTS — Interactive Periodic Table</title>
<style>
  :root{
    --bg:#05070d; --panel:#0b1120; --txt:#dbe7ff; --dim:#71809b;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  body{
    margin:0; min-height:100vh; color:var(--txt);
    background:radial-gradient(1200px 700px at 50% -10%, #0c1526 0%, var(--bg) 60%);
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    display:flex; flex-direction:column; align-items:center;
  }
  header{width:min(1500px,98vw); padding:20px 8px 10px; text-align:center}
  header h1{
    margin:0; font-size:clamp(1.2rem,3vw,1.9rem); letter-spacing:.35em; font-weight:800;
    background:linear-gradient(90deg,#22d3ee,#a78bfa,#ff8fd0);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 0 30px rgba(80,180,255,.25);
  }
  header p{margin:6px 0 0; color:var(--dim); font-size:.85rem; letter-spacing:.12em}
  .toolbar{width:min(1500px,98vw); display:flex; gap:14px; align-items:center; justify-content:center; flex-wrap:wrap; padding:8px 0}
  #search{
    background:#0a1222; border:1px solid #1f3350; color:var(--txt); border-radius:20px;
    padding:8px 16px; font-size:.9rem; width:230px; outline:none;
  }
  #search:focus{border-color:#3aa0e8; box-shadow:0 0 12px rgba(58,160,232,.35)}
  .legend{display:flex; flex-wrap:wrap; gap:6px; justify-content:center; max-width:min(1200px,96vw)}
  .chip{
    font-size:.68rem; letter-spacing:.04em; padding:4px 10px; border-radius:12px; cursor:pointer;
    border:1px solid color-mix(in srgb, var(--c) 55%, transparent);
    color:color-mix(in srgb, var(--c) 85%, white); background:color-mix(in srgb, var(--c) 12%, transparent);
    user-select:none; transition:filter .15s;
  }
  .chip:hover{filter:brightness(1.4)}
  .chip.off{opacity:.3}
  /* toolbar extras */
  .seg{display:flex; border:1px solid #1f3350; border-radius:20px; overflow:hidden}
  .seg button{background:transparent; border:none; color:#8fa3c7; padding:8px 13px; font-size:.78rem; cursor:pointer; border-right:1px solid #1f3350; letter-spacing:.02em}
  .seg button:last-child{border-right:none}
  .seg button.on{background:#132743; color:#7dd3fc}
  #quizBtn{cursor:pointer; background:#13203a; border:1px solid #37507a; color:#ffd166; border-radius:20px; padding:8px 16px; font-size:.85rem; font-weight:600; letter-spacing:.03em}
  #quizBtn:hover{box-shadow:0 0 14px rgba(255,209,102,.25)}
  #muteBtn{cursor:pointer; background:#0d1729; border:1px solid #24344f; border-radius:50%; width:38px; height:38px; font-size:.95rem}
  #muteBtn:hover{border-color:#7dd3fc}
  #quizBar{width:min(1500px,98vw); display:flex; gap:16px; align-items:center; justify-content:center; flex-wrap:wrap; padding:8px; margin-top:2px}
  #quizBar[hidden]{display:none}
  #quizQ{font-size:1.05rem; font-weight:700; color:#ffd166; text-shadow:0 0 14px rgba(255,209,102,.45)}
  #quizScore{color:#8fa3c7; font-size:.8rem}
  #quizStop{cursor:pointer; background:#0d1729; border:1px solid #24344f; color:#c3d1ec; border-radius:8px; padding:6px 12px; font-size:.78rem}
  #quizStop:hover{border-color:#ff5964; color:#ff5964}
  .el.good{border-color:#4ade80 !important; box-shadow:0 0 24px rgba(74,222,128,.8) !important; z-index:6}
  .el.bad{animation:shake .4s; border-color:#ff5964 !important; box-shadow:0 0 18px rgba(255,89,100,.7) !important; z-index:6}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
  .tag.st-g{color:#8be9fd; border-color:#8be9fd66}
  .tag.st-l{color:#ffb347; border-color:#ffb34766}
  .tag.st-s{color:#a9b8d8; border-color:#a9b8d866}
  .table-wrap{width:min(1500px,98vw); overflow-x:auto; padding:6px 10px 30px}
  #table{
    display:grid; grid-template-columns:repeat(18, minmax(52px,1fr));
    grid-auto-rows:minmax(56px,auto); gap:4px; min-width:1030px;
  }
  .el{
    position:relative; border-radius:6px; cursor:pointer; padding:3px 4px;
    display:flex; flex-direction:column; justify-content:center; align-items:center;
    background:linear-gradient(160deg, color-mix(in srgb, var(--c) 16%, #0b1220), #0a0f1cd9);
    border:1px solid color-mix(in srgb, var(--c) 45%, transparent);
    transition:transform .12s, box-shadow .12s, filter .2s, opacity .2s;
  }
  .el .n{position:absolute; top:2px; left:5px; font-size:.55rem; color:var(--dim)}
  .el .s{font-size:1.05rem; font-weight:800; color:#f2f7ff; line-height:1.1; text-shadow:0 0 10px color-mix(in srgb, var(--c) 70%, transparent)}
  .el .nm{font-size:.5rem; color:#a9b8d8; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .el .m{font-size:.45rem; color:var(--dim)}
  .el:hover{transform:translateY(-3px) scale(1.06); z-index:5; box-shadow:0 8px 22px rgba(0,0,0,.5), 0 0 18px color-mix(in srgb, var(--c) 55%, transparent); border-color:var(--c)}
  .el.dim{opacity:.15; filter:saturate(.2)}
  .gap{
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    font-size:.55rem; color:var(--dim); border:1px dashed #22314e; border-radius:6px; text-align:center; line-height:1.5;
  }
  .gap:hover{border-color:#7dd3fc; color:#7dd3fc}
  .flabel{align-self:center; justify-self:end; font-size:.6rem; color:var(--dim); padding-right:6px; letter-spacing:.1em}
  /* ============ HOLOGRAM OVERLAY ============ */
  #overlay{
    position:fixed; inset:0; z-index:50; display:none;
    align-items:center; justify-content:center; padding:12px;
    background:rgba(3,6,12,.86); backdrop-filter:blur(7px);
  }
  #overlay.show{display:flex}
  #overlay.closing{animation:fadeOut .18s forwards}
  @keyframes fadeOut{to{opacity:0}}
  .stage{width:min(94vw,600px); display:flex; flex-direction:column; align-items:center}
  .holo-zone{position:relative; width:min(78vw,420px); height:min(58vw,340px); perspective:900px}
  .holo{
    position:absolute; inset:0; transform-style:preserve-3d;
    display:flex; align-items:center; justify-content:center;
    animation:holoFlicker 4.5s steps(3) infinite;
  }
  .materialize{animation:materialize 1.25s cubic-bezier(.2,.8,.3,1) both}
  @keyframes materialize{
    0%{opacity:0; transform:scale(.1) translateY(60px); filter:blur(16px) brightness(4)}
    14%{opacity:.85; transform:scale(1.08) translateY(0); filter:blur(4px) brightness(2)}
    22%{opacity:.25}
    32%{opacity:1; filter:blur(1.5px) brightness(1.4)}
    48%{transform:scale(.97); filter:blur(.5px) brightness(1.1)}
    100%{opacity:1; transform:scale(1); filter:blur(0) brightness(1)}
  }
  @keyframes holoFlicker{0%,100%{opacity:1}48%{opacity:1}50%{opacity:.88}52%{opacity:1}80%{opacity:.96}82%{opacity:1}}
  .atom3d{position:relative; width:0; height:0; transform-style:preserve-3d; animation:yspin 16s linear infinite}
  @keyframes yspin{from{transform:rotateY(0)}to{transform:rotateY(360deg)}}
  .nucleus{
    position:absolute; width:46px; height:46px; left:-23px; top:-23px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff, color-mix(in srgb, var(--c) 80%, #fff) 40%, var(--c));
    box-shadow:0 0 24px color-mix(in srgb, var(--c) 90%, transparent), 0 0 60px color-mix(in srgb, var(--c) 45%, transparent), inset 0 0 10px rgba(255,255,255,.5);
    animation:pulse 2.6s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
  .ring{
    position:absolute; border-radius:50%; transform-style:preserve-3d;
    border:1.5px solid color-mix(in srgb, var(--c) 60%, transparent);
    box-shadow:0 0 10px color-mix(in srgb, var(--c) 30%, transparent), inset 0 0 10px color-mix(in srgb, var(--c) 20%, transparent);
    animation-name:orbit; animation-timing-function:linear; animation-iteration-count:infinite;
  }
  @keyframes orbit{from{transform:rotateX(var(--tx)) rotateY(var(--ty)) rotateZ(var(--z0))}to{transform:rotateX(var(--tx)) rotateY(var(--ty)) rotateZ(calc(var(--z0) + 360deg))}}
  .e{
    position:absolute; width:7px; height:7px; left:calc(50% - 3.5px); top:calc(50% - 3.5px); border-radius:50%;
    background:#fff; box-shadow:0 0 8px var(--c), 0 0 14px var(--c);
  }
  .scanline{
    position:absolute; left:-6%; width:112%; height:5px; pointer-events:none;
    background:linear-gradient(90deg, transparent, color-mix(in srgb, var(--c) 90%, white), transparent);
    filter:blur(1px); animation:scan 1.1s ease-out both;
  }
  @keyframes scan{from{top:100%; opacity:.9}to{top:-5%; opacity:0}}
  .projector{position:relative; width:min(70vw,330px); height:64px; margin-top:-10px}
  .cone{
    position:absolute; left:50%; bottom:52px; transform:translateX(-50%);
    width:280px; height:250px; opacity:.16; filter:blur(3px); pointer-events:none;
    clip-path:polygon(50% 0, 100% 100%, 0 100%);
    background:linear-gradient(to bottom, color-mix(in srgb, var(--c) 90%, white), transparent 80%);
    animation:coneFlicker 3.5s ease-in-out infinite;
  }
  @keyframes coneFlicker{0%,100%{opacity:.16}50%{opacity:.22}}
  .base{
    position:absolute; left:50%; bottom:8px; transform:translateX(-50%);
    width:270px; height:40px; border-radius:50%;
    background:radial-gradient(ellipse at center, color-mix(in srgb, var(--c) 55%, #0a1220) 0%, color-mix(in srgb, var(--c) 18%, #0a1220) 45%, transparent 70%);
    box-shadow:0 0 30px color-mix(in srgb, var(--c) 35%, transparent);
  }
  .base::after{
    content:""; position:absolute; inset:10px 30px; border-radius:50%;
    border:1px solid color-mix(in srgb, var(--c) 70%, transparent);
  }
  /* info card */
  .card{
    width:100%; margin-top:14px; border-radius:16px; padding:16px 20px 14px;
    background:rgba(9,15,28,.78); border:1px solid color-mix(in srgb, var(--c) 45%, transparent);
    box-shadow:0 10px 40px rgba(0,0,0,.6), inset 0 0 40px color-mix(in srgb, var(--c) 7%, transparent);
    backdrop-filter:blur(8px); animation:cardIn .5s .25s cubic-bezier(.2,.8,.3,1) both;
  }
  @keyframes cardIn{from{opacity:0; transform:translateY(18px)}to{opacity:1; transform:none}}
  .card .head{display:flex; align-items:center; gap:14px; flex-wrap:wrap}
  .badge{
    width:54px; height:54px; border-radius:10px; flex:none;
    display:flex; align-items:center; justify-content:center;
    font-size:1.5rem; font-weight:800; color:#fff;
    background:linear-gradient(160deg, color-mix(in srgb, var(--c) 35%, #0b1220), #0a0f1c);
    border:1px solid var(--c); text-shadow:0 0 12px var(--c);
    box-shadow:0 0 18px color-mix(in srgb, var(--c) 40%, transparent);
  }
  .card h2{margin:0; font-size:1.45rem}
  .card .sub{color:var(--dim); font-size:.8rem}
  .meta{margin-left:auto; text-align:right; font-size:.75rem; color:var(--dim); line-height:1.7}
  .tags{display:flex; gap:6px; flex-wrap:wrap; margin:10px 0 2px}
  .tag{font-size:.68rem; padding:3px 10px; border-radius:11px; border:1px solid color-mix(in srgb, var(--c) 55%, transparent); color:color-mix(in srgb, var(--c) 80%, white); background:color-mix(in srgb, var(--c) 10%, transparent)}
  .sec{margin-top:10px}
  .sec b{display:block; font-size:.68rem; letter-spacing:.22em; color:color-mix(in srgb, var(--c) 85%, white); margin-bottom:3px}
  .sec p{margin:0; font-size:.86rem; line-height:1.55; color:#c3d1ec}
  .photo-box{
    position:relative; border-radius:10px; overflow:hidden; min-height:110px;
    border:1px solid color-mix(in srgb, var(--c) 35%, transparent);
    background:#070b14; display:flex; align-items:center; justify-content:center;
  }
  .photo-box img{display:block; width:100%; max-height:230px; object-fit:contain}
  .photo-loading,.photo-none{color:var(--dim); font-size:.75rem; padding:26px 14px; text-align:center; line-height:1.5}
  .credit{
    position:absolute; right:8px; bottom:6px; font-size:.6rem; color:#9db7e8;
    background:rgba(5,8,15,.7); padding:2px 8px; border-radius:8px; letter-spacing:.04em;
  }
  .credit a{color:#9db7e8; text-decoration:none}
  .credit a:hover{text-decoration:underline}
  .navrow{display:flex; gap:10px; margin-top:14px; align-items:center}
  .btn{
    cursor:pointer; border-radius:10px; padding:8px 18px; font-size:.85rem; color:var(--txt);
    background:#0d1729; border:1px solid #24344f; transition:all .15s;
  }
  .btn:hover{border-color:var(--c); box-shadow:0 0 12px color-mix(in srgb, var(--c) 35%, transparent)}
  .btn.primary{border-color:color-mix(in srgb, var(--c) 60%, transparent); color:color-mix(in srgb, var(--c) 90%, white)}
  #closeBtn{
    position:absolute; top:14px; right:18px; z-index:5; cursor:pointer;
    width:38px; height:38px; border-radius:50%; font-size:1.1rem; line-height:1;
    color:var(--txt); background:rgba(13,23,41,.9); border:1px solid #24344f;
  }
  #closeBtn:hover{border-color:#ff5964; color:#ff5964}
  footer{color:#3d4a63; font-size:.7rem; padding:0 0 18px; letter-spacing:.1em}
  @media (max-width:600px){
    .card h2{font-size:1.15rem}
    .meta{margin-left:0; text-align:left; width:100%}
  }
</style>
</head>
<body>
<header>
  <h1>HOLO · ELEMENTS</h1>

<div class="toolbar">
  <input id="search" type="text" placeholder="Search name, symbol or number…" autocomplete="off">

    <button data-st="all" class="on">All</button>
    <button data-st="s">■ Solid</button>

</div>

<div class="legend" id="legend"></div>

/* ---- hologram ---- */
function flavor(cat, el){
  const [num,sym,name,mass,c,g,p,shells] = el;
  switch(cat){
    case 'alkali': return `One single electron sits outside a full shell. These metals practically throw it away — reacting violently even with water — to reach a stable octet. Every Group 1 atom tends to form +1 ions.`;
    case 'alkaline': return `Two outer electrons to give away. Reactive, but noticeably calmer than their Group 1 neighbors; they form +2 ions and their compounds color flames orange-red.`;
    case 'transition': return `Groups 3–12 are the transition metals: the five d orbitals are filling. Because d electrons can join or stay out of bonding, these metals hop between oxidation states and make the world's most colorful compounds.`;
    case 'post': return `A metal with its d shell already full — the softer, lower-melting metals that come after the transition block.`;
    case 'metalloid': return `It stands on the border between metals and nonmetals — conducting only sometimes. That fence-sitting is exactly what makes semiconductors (and computers) possible.`;
    case 'nonmetal': return `A reactive nonmetal: it gains or shares electrons rather than donating them, hunting to complete its outer shell.`;
    case 'halogen': return `Just one electron short of a full shell, halogens grab electrons from almost anyone — the most reactive nonmetals of all, forming −1 ions.`;
    case 'noble': return `Its outermost shell is completely full — the chemical equivalent of 'nothing left to want'. That's why noble gases almost never react with anything.`;
    case 'lanthanide': return `Its 4f orbitals are filling. Chemically the lanthanides are near-identical 'rare earth' cousins of Group 3 — so similar that the table pulls them out into this separate row to stay readable.`;
    case 'actinide': return `Its 5f orbitals are filling. Every actinide is radioactive — the later ones exist only because humans fused them into being, one atom at a time.`;
  }
}
function whyHere(el){
  const [num,sym,name,mass,cat,g,p,shells] = el;
  const pos = g>0 ? `It lives in <b>Group ${g}</b>, <b>Period ${p}</b>` : `It lives in the <b>f-block</b> (Period ${p})`;
  const intro = `${pos}. Its ${shells.length} electron shell${shells.length>1?'s':''} hold${shells.length>1?'':'s'} ${shells.join(' · ')} electron${num>1?'s':''}. `;
  if (num===1) return intro + `Hydrogen is the odd one out: it sits in Group 1 for its single outer electron, but it's a gas, not a metal — in truth, it's a family of one, first in line because it is the simplest atom of all.`;
  const valence = g>0 ? (g<=2 ? g : g-10) : null;
  const vg = (g>0 && cat!=='transition') ? ` In the main groups, the group number is a shortcut: Group ${g} means <b>${valence} valence electron${valence>1?'s':''}</b>.` : '';
  return intro + vg + ' ' + flavor(cat, el);
}
function buildAtom(shells, color){
  holo.innerHTML = '';
  const atom = document.createElement('div');
  atom.className = 'atom3d';
  const nuc = document.createElement('div');
  nuc.className = 'nucleus';
  atom.appendChild(nuc);
  const r0 = 44, step = 27;
  shells.forEach((cnt, i)=>{
    const r = r0 + i*step;
    const ring = document.createElement('div');
    ring.className = 'ring';
    const size = r*2;
    ring.style.width = ring.style.height = size+'px';
    ring.style.left = -r+'px'; ring.style.top = -r+'px';
    ring.style.setProperty('--tx', (68 + (i%3)*6) + 'deg');
    ring.style.setProperty('--ty', (i*47%360) + 'deg');
    ring.style.setProperty('--z0', (i*90) + 'deg');
    const dur = 7 + i*3.2;
    ring.style.animationDuration = dur + 's';
    ring.style.animationDirection = i%2 ? 'normal' : 'reverse';
    for (let k=0;k<cnt;k++){
      const e = document.createElement('div');
      e.className = 'e';
      e.style.transform = `rotate(${(360/cnt)*k}deg) translateX(${r}px)`;
      ring.appendChild(e);
    }
    atom.appendChild(ring);
  });
  holo.appendChild(atom);
}
/* ---- real-form sample photos (Wikimedia Commons, fetched on click) ---- */
const WIKI_FIX = {80: "Mercury (element)"}; // plain names that don't lead to the element article
const LOCAL_PHOTOS = {80: "photos/hg.jpg", 96: "photos/cm.jpg", 100: "photos/fm.jpg", 101: "photos/md.jpg", 102: "photos/no.jpg", 117: "photos/ts.jpg"}; // atomic number -> file in photos/ (hand-made artwork takes priority over Wikipedia)
let photoAbort = null;
function loadPhoto(name, num){
  if (photoAbort) photoAbort.abort();
  photoAbort = (typeof AbortController === 'function') ? new AbortController() : null;
  const signal = photoAbort ? photoAbort.signal : undefined;
  const box = document.getElementById('photoBox');
  if (!box) return;
  box.innerHTML = '<span class="photo-loading">retrieving sample photo…</span>';
  const local = LOCAL_PHOTOS[num];
  if (local && typeof Image === 'function'){
    const img = new Image();
    img.onload = ()=>{
      box.innerHTML = '';
      img.alt = 'Sample of ' + name;
      box.appendChild(img);
      const c = document.createElement('span');
      c.className = 'credit';
      c.textContent = 'custom artwork';
      box.appendChild(c);
    };
    img.onerror = ()=> apiPhoto();
    img.src = local;
    return;
  }
  apiPhoto();
  function apiPhoto(){
    const title = WIKI_FIX[num] || name;
    const url = 'https://en.wikipedia.org/w/api.php?action=query&titles=' + encodeURIComponent(title)
              + '&prop=pageimages&format=json&origin=*&pithumbsize=640';
    fetch(url, {signal})
      .then(r => r.json())
      .then(d => {
        const pages = d.query && d.query.pages;
        const page = pages && pages[Object.keys(pages)[0]];
        const thumb = page && page.thumbnail && page.thumbnail.source;
        if (!thumb) throw new Error('NO_IMAGE');
        box.innerHTML = '<img src="' + thumb + '" alt="Sample of ' + name + '" loading="lazy">'
          + '<span class="credit"><a href="https://en.wikipedia.org/wiki/' + encodeURIComponent(title) + '" target="_blank" rel="noopener">photo · Wikipedia</a></span>';
      })
      .catch(err => {
        if (err && err.name === 'AbortError') return;
        if (err && err.message === 'NO_IMAGE'){
          box.innerHTML = '<span class="photo-none">No sample photo exists — this element is too rare, dangerous or short-lived to have been photographed.</span>';
        } else {
          box.innerHTML = '<span class="photo-none">Sample photos load from Wikipedia — couldn\u2019t reach it (offline?).</span>';
        }
      });
  }
}
function openHolo(num){
  currentIdx = E.findIndex(e=>e[0]===num);
  sfx.spawn();
  current = E[currentIdx];
  const [n,sym,name,mass,cat,g,p,shells] = current;
  const color = CAT[cat].c;
  const massStr = Array.isArray(mass) ? '['+mass[0]+']' : mass;
  overlay.style.setProperty('--c', color);
  buildAtom(shells, color);
  /* restart animations by re-cloning */
  holo.classList.remove('materialize'); void holo.offsetWidth; holo.classList.add('materialize');
  scan.style.display='block'; scan.style.setProperty('--c', color);
  scan.style.animation='none'; void scan.offsetWidth; scan.style.animation='';
  card.innerHTML = `
    <div class="head">
      <div class="badge">${sym}</div>
      <div>
        <h2>${name}</h2>
        <div class="sub">Atomic number ${n} · ${sym}</div>
      </div>
      <div class="meta">mass ${massStr} u<br>${shells.length} shell${shells.length>1?'s':''}: ${shells.join('·')}</div>
    </div>
    <div class="tags">
      <span class="tag">${CAT[cat].name}</span>
      <span class="tag">${g>0 ? 'Group '+g : 'f-block'}</span>
      <span class="tag">Period ${p}</span>
      <span class="tag st-${stateOf(n)}">${stateLabel(n)} at 25°C</span>
    </div>
    <div class="sec"><b>REAL FORM</b><div class="photo-box" id="photoBox"><span class="photo-loading">retrieving sample photo…</span></div></div>
    <div class="sec"><b>WHAT IT IS</b><p>${current[8]}</p></div>
    <div class="sec"><b>WHY IT SITS THERE</b><p>${whyHere(current)}</p></div>
  `;
  overlay.classList.remove('show','closing');
  void overlay.offsetWidth;
  overlay.classList.add('show');
  loadPhoto(name, n);
  document.body.style.overflow='hidden';
}
function closeHolo(){
  sfx.close();
  overlay.classList.add('closing');
  setTimeout(()=>{ overlay.classList.remove('show','closing'); document.body.style.overflow=''; }, 180);
}
document.getElementById('closeBtn').addEventListener('click', closeHolo);
overlay.addEventListener('click', e=>{ if(e.target===overlay) closeHolo(); });
document.getElementById('prevBtn').addEventListener('click', ()=>openHolo(E[(currentIdx+117)%118][0]));
document.getElementById('nextBtn').addEventListener('click', ()=>openHolo(E[(currentIdx+1)%118][0]));
document.getElementById('randBtn').addEventListener('click', ()=>openHolo(E[Math.floor(Math.random()*118)][0]));
document.addEventListener('keydown', e=>{
  if (!overlay.classList.contains('show')) return;
  if (e.key==='Escape') closeHolo();
  if (e.key==='ArrowLeft') openHolo(E[(currentIdx+117)%118][0]);
  if (e.key==='ArrowRight') openHolo(E[(currentIdx+1)%118][0]);
});

/* ---- sound engine (Web Audio, no files needed) ---- */
let AC = null, muted = false;
try { muted = localStorage.getItem('holoMuted') === '1'; } catch(e){}
function tone(freq, delay, dur, type='sine', gain=0.06){
  try{
    if (muted) return;
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const t = AC.currentTime + delay;
    const o = AC.createOscillator(), v = AC.createGain();
    o.type = type; o.frequency.value = freq;
    v.gain.setValueAtTime(0.0001, t);
    v.gain.exponentialRampToValueAtTime(gain, t + 0.012);
    v.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(v); v.connect(AC.destination);
    o.start(t); o.stop(t + dur + 0.05);
  } catch(e){ /* audio unavailable — stay silent */ }
}
const sfx = {
  click(){ tone(660, 0, .07, 'triangle', .05); tone(880, .05, .09, 'triangle', .035); },
  spawn(){ [523, 659, 784, 1047].forEach((f,i)=> tone(f, i*.07, .2, 'sine', .045)); },
  close(){ tone(523, 0, .09, 'sine', .04); tone(392, .08, .13, 'sine', .035); },
  correct(){ [523, 659, 784, 1047, 1319].forEach((f,i)=> tone(f, i*.08, .22, 'triangle', .055)); },
  wrong(){ tone(185, 0, .2, 'sawtooth', .04); tone(140, .11, .26, 'sawtooth', .04); },
};
const muteBtn = document.getElementById('muteBtn');
function renderMute(){ muteBtn.textContent = muted ? '🔇' : '🔊'; }
muteBtn.addEventListener('click', ()=>{
  muted = !muted;
  try { localStorage.setItem('holoMuted', muted ? '1' : '0'); } catch(e){}
  renderMute();
});
renderMute();

/* ---- quiz mode ---- */
let quiz = null;
const quizBtn = document.getElementById('quizBtn');
const quizBar = document.getElementById('quizBar');
const quizQ = document.getElementById('quizQ');
const quizScore = document.getElementById('quizScore');
const quizStop = document.getElementById('quizStop');

function makeQuestion(){
  const r = Math.random();
  const pool = Math.random() < 0.8 ? E.slice(0, 92) : E; // favor elements people can actually find
  const el = pool[Math.floor(Math.random()*pool.length)];
  const [num, sym, name,,, cat] = el;
  if (r < 0.2){
    const keys = Object.keys(CAT);
    const k = keys[Math.floor(Math.random()*keys.length)];
    return {type:'cat', cat:k, num:null, prompt:`Tap ANY ${CAT[k].name.toLowerCase()}`};
  }
  if (r < 0.55) return {type:'name', num, prompt:`Tap: ${name}`};
  if (r < 0.8)  return {type:'sym',  num, prompt:`Tap the element with symbol “${sym}”`};
  return {type:'num', num, prompt:`Tap atomic number ${num}`};
}
function updateQuizBar(){
  quizScore.textContent = `Score ${quiz.correct}/${quiz.i} · Streak ${quiz.streak}🔥`;
}
function nextQuestion(){
  quizQ.textContent = `Q${quiz.i+1}/${quiz.total} — ${quiz.qs[quiz.i].prompt}`;
  updateQuizBar();
}
function startQuiz(){
  if (quiz) return;
  quiz = {i:0, total:10, correct:0, streak:0, best:0, qs: Array.from({length:10}, makeQuestion)};
  quizBar.hidden = false;
  nextQuestion();
}
function endQuiz(){
  quizQ.textContent = `🏁 Round complete! Score ${quiz.correct}/${quiz.total} · Best streak ${quiz.best}`;
  quizScore.textContent = '';
  quiz = null;
}
function stopQuiz(){
  quiz = null;
  quizBar.hidden = true;
}
function flashTile(tile, cls){
  tile.classList.add(cls);
  setTimeout(()=> tile.classList.remove(cls), 650);
}
quizBtn.addEventListener('click', ()=>{ sfx.click(); startQuiz(); });
quizStop.addEventListener('click', stopQuiz);
function answerQuiz(num, tile){
  const q = quiz.qs[quiz.i];
  const ok = q.type === 'cat' ? E[num-1][4] === q.cat : num === q.num;
  if (ok){
    quiz.correct++; quiz.streak++;
    quiz.best = Math.max(quiz.best, quiz.streak);
    sfx.correct(); flashTile(tile, 'good');
    setTimeout(()=> openHolo(num), 650); // reward hologram
  } else {
    quiz.streak = 0;
    sfx.wrong(); flashTile(tile, 'bad');
  }
  quiz.i++;
  if (quiz.i >= quiz.total) setTimeout(endQuiz, ok ? 1200 : 500);
  else nextQuestion();
}
function handleTileClick(num, tile){
  if (quiz){ answerQuiz(num, tile); return; }
  sfx.click();
  openHolo(num);
}
</script>
